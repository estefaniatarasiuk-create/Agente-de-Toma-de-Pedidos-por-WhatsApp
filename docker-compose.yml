services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp_orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatsapp_orders}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_orders}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsapp_orders}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Next.js "inlinea" las variables NEXT_PUBLIC_* en el bundle del
        # cliente durante el build, no en runtime: por eso viajan como build
        # arg (Compose las toma del .env de la raíz) y no alcanza con
        # declararlas en `environment`.
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-whatsapp_orders}:${POSTGRES_PASSWORD:-whatsapp_orders}@postgres:5432/${POSTGRES_DB:-whatsapp_orders}
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node server.js"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
